plugins {
    id 'java'
    id 'io.github.sunjirapath.bootbomguard'
}
repositories { mavenCentral() }
def scenario = providers.gradleProperty('scenario').getOrElse('aligned')
if (scenario == 'unresolved') {
    repositories {
        exclusiveContent {
            forRepository { maven { url = uri('missing-repository') } }
            filter { includeGroup 'guard.fixture' }
        }
    }
}
dependencies {
    if (scenario == 'missing-imported-baseline') {
        implementation platform('org.springframework.boot:spring-boot-dependencies:4.0.0-audit')
    } else if (scenario == 'transitive-platform') {
        implementation platform(project(':local-platform'))
    } else if (scenario != 'missing') {
        if (scenario == 'ambiguous') {
            implementation(platform('org.springframework.boot:spring-boot-dependencies:4.0.0')) { version { strictly '4.0.0' } }
        } else {
            implementation(scenario == 'enforced' ? enforcedPlatform('org.springframework.boot:spring-boot-dependencies:4.0.0') : platform('org.springframework.boot:spring-boot-dependencies:4.0.0'))
        }
    }
    if (scenario == 'ambiguous') {
        implementation(platform('org.springframework.boot:spring-boot-dependencies:4.0.1')) { version { strictly '4.0.1' } }
    }
    if (scenario == 'multiple-boms') {
        implementation enforcedPlatform('org.springframework.boot:spring-boot-dependencies:4.0.1')
    }
    if (scenario in ['rich-strict', 'strict-conflict']) {
        implementation('org.slf4j:slf4j-api') { version { strictly '2.0.18' } }
    } else if (scenario in ['rich-reject', 'bounded-range']) {
        implementation('org.slf4j:slf4j-api') {
            version {
                require '[2.0.17,2.0.18]'
                if (scenario == 'rich-reject') reject '2.0.17'
            }
        }
    } else if (scenario == 'transitive') {
        implementation 'org.slf4j:slf4j-simple:2.0.18'
    } else if (scenario in ['direct', 'allowlist', 'enforced', 'forced', 'invalid-exception', 'composite-baseline', 'missing-baseline', 'missing-imported-baseline']) {
        implementation 'org.slf4j:slf4j-api:2.0.18'
    } else {
        implementation 'org.slf4j:slf4j-api:2.0.17'
    }
    if (scenario == 'strict-conflict') {
        constraints { implementation('org.slf4j:slf4j-api') { version { strictly '2.0.17' } } }
    }
    if (scenario == 'managed') {
        constraints { implementation 'org.slf4j:slf4j-api:2.0.18' }
    }
    if (scenario == 'imported-bom') implementation 'org.springframework:spring-core'
    if (scenario == 'imported-override') implementation 'org.springframework:spring-core:7.0.2'
    if (scenario == 'unmanaged') implementation 'org.apache.maven:maven-artifact:3.9.16'
    if (scenario == 'unresolved') implementation 'guard.fixture:missing:1'
}
if (scenario == 'forced') {
    configurations.configureEach { resolutionStrategy.force 'org.slf4j:slf4j-api:2.0.18' }
}
if (scenario == 'substitution') {
    configurations.configureEach {
        resolutionStrategy.dependencySubstitution {
            substitute module('org.slf4j:slf4j-api') using module('org.slf4j:slf4j-simple:2.0.18')
        }
    }
}
bootBomGuard {
    failOnDrift = providers.gradleProperty('failOnDrift').map { it.toBoolean() }.getOrElse(false)
    if (scenario == 'allowlist') exceptions.put('org.slf4j:slf4j-api', 'Reviewed logging upgrade')
    if (scenario == 'invalid-exception') exceptions.put('org.slf4j:slf4j-api', ' ')
    if (scenario == 'missing-configuration') configurations = ['notThere']
    if (scenario == 'non-resolvable') configurations = ['implementation']
    if (scenario == 'empty-configurations') configurations = []
    if (scenario == 'custom-configuration') configurations = ['runtimeClasspath', 'runtimeClasspath']
}
if (scenario == 'lazy') {
    configurations.configureEach { incoming.beforeResolve { throw new GradleException('Unexpected configuration-time resolution') } }
}
if (scenario == 'resolution-error') {
    configurations.configureEach { incoming.beforeResolve { throw new GradleException('https://fixture-user:fixture-secret@invalid') } }
}

if (scenario == 'composite-baseline') {
    configurations.configureEach { resolutionStrategy.useGlobalDependencySubstitutionRules = false }
}
if (scenario == 'missing-baseline') {
    bootBomGuard.configurations = ['runtimeClasspath']
    configurations.runtimeClasspath.incoming.afterResolve {
        println 'NATIVE_SELECTED=' + it.resolutionResult.allComponents.collect { it.id.displayName }.sort()
        repositories.clear()
    }
}

if (scenario == 'selection-rule') {
    configurations.configureEach {
        resolutionStrategy.eachDependency { if (requested.group == 'org.slf4j' && requested.name == 'slf4j-api') useVersion '2.0.18' }
    }
}
if (scenario == 'project-substitution') {
    configurations.configureEach {
        resolutionStrategy.dependencySubstitution {
            substitute module('org.slf4j:slf4j-api') using project(':replacement')
        }
    }
}

if (scenario == 'missing-imported-baseline') {
    bootBomGuard.configurations = ['runtimeClasspath']
    configurations.runtimeClasspath.incoming.afterResolve {
        println 'NATIVE_SELECTED=' + it.resolutionResult.allComponents.collect { it.id.displayName }.sort()
        repositories.clear()
        repositories.maven { url = uri('partial-baseline') }
    }
}

if (scenario in ['rich-strict', 'rich-reject', 'bounded-range']) {
    tasks.named('bootBomGuard') {
        doFirst {
            def nativeGraph = configurations.runtimeClasspath.incoming.resolutionResult
            println 'NATIVE_SELECTED=' + nativeGraph.allComponents.collect { it.id.displayName }.sort()
            println 'NATIVE_UNRESOLVED=' + nativeGraph.allDependencies.findAll { it instanceof org.gradle.api.artifacts.result.UnresolvedDependencyResult }.collect { it.requested.displayName }.sort()
        }
    }
}

if (scenario == 'local-files') dependencies { implementation files('unversioned.jar') }
if (scenario == 'empty-metadata') {
    dependencies.components.withModule('org.springframework.boot:spring-boot-dependencies') {
        allVariants { withDependencyConstraints { removeAll { true } } }
    }
}
