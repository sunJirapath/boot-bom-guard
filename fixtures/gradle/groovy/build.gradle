plugins {
    id 'java'
    id 'io.github.bootbomguard'
}
repositories { mavenCentral() }
def scenario = providers.gradleProperty('scenario').getOrElse('aligned')
dependencies {
    if (scenario != 'missing') {
        if (scenario == 'ambiguous') {
            implementation(platform('org.springframework.boot:spring-boot-dependencies:4.0.0')) { version { strictly '4.0.0' } }
        } else {
            implementation(scenario == 'enforced' ? enforcedPlatform('org.springframework.boot:spring-boot-dependencies:4.0.0') : platform('org.springframework.boot:spring-boot-dependencies:4.0.0'))
        }
    }
    if (scenario == 'ambiguous') {
        implementation(platform('org.springframework.boot:spring-boot-dependencies:4.0.1')) { version { strictly '4.0.1' } }
    }
    if (scenario == 'multiple-boms') {
        implementation enforcedPlatform('org.springframework.boot:spring-boot-dependencies:4.0.1')
    }
    if (scenario == 'transitive') {
        implementation 'org.slf4j:slf4j-simple:2.0.18'
    } else if (scenario in ['direct', 'allowlist', 'enforced', 'forced', 'invalid-exception']) {
        implementation 'org.slf4j:slf4j-api:2.0.18'
    } else {
        implementation 'org.slf4j:slf4j-api:2.0.17'
    }
    if (scenario == 'managed') {
        constraints { implementation 'org.slf4j:slf4j-api:2.0.18' }
    }
    if (scenario == 'imported-bom') implementation 'org.springframework:spring-core'
    if (scenario == 'imported-override') implementation 'org.springframework:spring-core:7.0.2'
    if (scenario == 'unmanaged') implementation 'org.apache.maven:maven-artifact:3.9.16'
}
if (scenario == 'forced') {
    configurations.configureEach { resolutionStrategy.force 'org.slf4j:slf4j-api:2.0.18' }
}
if (scenario == 'substitution') {
    configurations.configureEach {
        resolutionStrategy.dependencySubstitution {
            substitute module('org.slf4j:slf4j-api') using module('org.slf4j:slf4j-simple:2.0.18')
        }
    }
}
bootBomGuard {
    failOnDrift = providers.gradleProperty('failOnDrift').map { it.toBoolean() }.getOrElse(false)
    if (scenario == 'allowlist') exceptions.put('org.slf4j:slf4j-api', 'Reviewed logging upgrade')
    if (scenario == 'invalid-exception') exceptions.put('org.slf4j:slf4j-api', ' ')
}
if (scenario == 'lazy') {
    configurations.configureEach { incoming.beforeResolve { throw new GradleException('Unexpected configuration-time resolution') } }
}
