name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Maven 3.9.16
        run: |
          set -euo pipefail
          version=3.9.16
          archive="apache-maven-${version}-bin.tar.gz"
          url="https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/${version}/${archive}"
          curl --fail --location --silent --show-error --output "$archive" "$url"
          curl --fail --location --silent --show-error --output "${archive}.sha512" "${url}.sha512"
          printf '%s  %s\n' "$(tr -d '[:space:]' < "${archive}.sha512")" "$archive" | sha512sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-${version}/bin" >> "$GITHUB_PATH"

      - run: mvn -B -ntp install
      - run: python3 scripts/verify_maven.py
      - run: ./gradlew --no-daemon check
