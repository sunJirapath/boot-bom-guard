name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Owner-only PR gate: skip PRs not authored by the repo owner or coming from forks.
  verify:
    if: github.event_name != 'pull_request' || (github.event.pull_request.user.login == github.repository_owner && github.event.pull_request.head.repo.full_name == github.repository)
    name: ${{ matrix.os }} / JDK ${{ matrix.java }} / Maven 3.9.16 / Gradle ${{ matrix.gradle }}
    strategy:
      fail-fast: false
      matrix:
        gradle: ['8.14.3', '9.8.2']
        os: ['ubuntu-24.04']
        java: ['21']
        include:
          - os: macos-15
            gradle: '8.14.3'
            java: '21'
          - os: ubuntu-24.04
            gradle: '8.14.3'
            java: '17'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: |
            17
            ${{ matrix.java }}

      - name: Install Maven 3.9.16
        run: |
          set -euo pipefail
          version=3.9.16
          archive="apache-maven-${version}-bin.tar.gz"
          url="https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/${version}/${archive}"
          curl --fail --location --silent --show-error --output "$archive" "$url"
          curl --fail --location --silent --show-error --output "${archive}.sha512" "${url}.sha512"
          python3 -c 'import hashlib, pathlib, sys; p = pathlib.Path(sys.argv[1]); assert hashlib.sha512(p.read_bytes()).hexdigest() == pathlib.Path(str(p) + ".sha512").read_text().strip()' "$archive"
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-${version}/bin" >> "$GITHUB_PATH"

      - run: mvn -B -ntp install
      - run: python3 scripts/verify_maven.py
      - name: Install Gradle ${{ matrix.gradle }}
        env:
          GRADLE_VERSION: ${{ matrix.gradle }}
        run: |
          set -euo pipefail
          archive="gradle-${GRADLE_VERSION}-bin.zip"
          url="https://services.gradle.org/distributions/${archive}"
          curl --fail --location --silent --show-error --output "$archive" "$url"
          curl --fail --location --silent --show-error --output "${archive}.sha256" "${url}.sha256"
          python3 -c 'import hashlib, pathlib, sys; p = pathlib.Path(sys.argv[1]); assert hashlib.sha256(p.read_bytes()).hexdigest() == pathlib.Path(str(p) + ".sha256").read_text().strip()' "$archive"
          unzip -q "$archive" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - run: gradle --no-daemon check

      - name: Clean-cache source install and external consumers
        run: python3 scripts/verify_install.py --gradle "$(command -v gradle)"

  windows:
    if: github.event_name != 'pull_request' || (github.event.pull_request.user.login == github.repository_owner && github.event.pull_request.head.repo.full_name == github.repository)
    name: Windows / JDK 21 / Maven 3.9.16 / Gradle 8.14.3
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: |
            17
            21
      - name: Install pinned Maven and Gradle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $mavenArchive = Join-Path $env:RUNNER_TEMP 'apache-maven-3.9.16-bin.zip'
          $mavenUrl = 'https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.zip'
          Invoke-WebRequest $mavenUrl -OutFile $mavenArchive
          Invoke-WebRequest "$mavenUrl.sha512" -OutFile "$mavenArchive.sha512"
          $mavenHash = (Get-Content -LiteralPath "$mavenArchive.sha512" -Raw).Trim()
          if ((Get-FileHash -LiteralPath $mavenArchive -Algorithm SHA512).Hash -ine $mavenHash) { throw 'Maven checksum mismatch' }
          Expand-Archive -LiteralPath $mavenArchive -DestinationPath $env:RUNNER_TEMP
          (Join-Path $env:RUNNER_TEMP 'apache-maven-3.9.16/bin') | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          $gradleArchive = Join-Path $env:RUNNER_TEMP 'gradle-8.14.3-bin.zip'
          $gradleUrl = 'https://services.gradle.org/distributions/gradle-8.14.3-bin.zip'
          Invoke-WebRequest $gradleUrl -OutFile $gradleArchive
          Invoke-WebRequest "$gradleUrl.sha256" -OutFile "$gradleArchive.sha256"
          $gradleHash = (Get-Content -LiteralPath "$gradleArchive.sha256" -Raw).Trim()
          if ((Get-FileHash -LiteralPath $gradleArchive -Algorithm SHA256).Hash -ine $gradleHash) { throw 'Gradle checksum mismatch' }
          Expand-Archive -LiteralPath $gradleArchive -DestinationPath $env:RUNNER_TEMP
          (Join-Path $env:RUNNER_TEMP 'gradle-8.14.3/bin') | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - run: mvn -B -ntp install
      - run: python scripts/verify_maven.py
      - run: gradle --no-daemon check
      - name: Clean-cache source install and external consumers
        run: python scripts/verify_install.py --gradle (Get-Command gradle.bat).Source

  maven-compatibility:
    if: github.event_name != 'pull_request' || (github.event.pull_request.user.login == github.repository_owner && github.event.pull_request.head.repo.full_name == github.repository)
    name: Maven ${{ matrix.maven }} compatibility / JDK 21
    strategy:
      fail-fast: false
      matrix:
        maven: ['3.10.0', '4.0.0-rc-7']
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Maven
        env:
          MAVEN_VERSION: ${{ matrix.maven }}
        run: |
          set -euo pipefail
          archive="apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          url="https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/${MAVEN_VERSION}/${archive}"
          curl --fail --location --silent --show-error --output "$archive" "$url"
          curl --fail --location --silent --show-error --output "${archive}.sha512" "${url}.sha512"
          python3 -c 'import hashlib, pathlib, sys; p = pathlib.Path(sys.argv[1]); assert hashlib.sha512(p.read_bytes()).hexdigest() == pathlib.Path(str(p) + ".sha512").read_text().strip()' "$archive"
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"
      - run: mvn -B -ntp install
      - run: python3 scripts/verify_maven.py
